name: Feature request
description: Propose a command, API operation, or workflow improvement.
title: 'feat: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include credentials or private FreeAgent records.
  - type: textarea
    attributes:
      label: User problem
      description: Describe the outcome that is difficult today.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed CLI contract
      description: Include the command shape, machine output, risk class, and approval boundary when known.
    validations:
      required: true
  - type: input
    attributes:
      label: FreeAgent documentation
      description: Link the primary API documentation when the request concerns an API operation.
  - type: textarea
    attributes:
      label: Alternatives
      description: Describe safe workarounds or existing commands considered.
